/* ============================ level load ============================ */

async function fetchLevel(n){          // the inlined PACK, not the network
  const txt = PACK[n - 1].trim();
  if (!txt.startsWith('gzip:')) return JSON.parse(txt);
  const bin = Uint8Array.from(atob(txt.slice(5)), c => c.charCodeAt(0));
  const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(stream).json();
}

function buildState(n, raw){
  const pid = raw.PixelImageData;
  const W = pid.width, H = pid.height;
  const owner = new Int32Array(W * H).fill(-1);
  const pixels = [];
  /* Hard pixels. `pixelHealths` is populated in 110 of the 2300 levels (681
     entries, health 2..100) - the earlier claim that this funnel has none was
     wrong. It matters for the ammo budget too: on those levels the per-material
     ammo equals the SUM OF HEALTH, not the pixel count (42/110 match exactly;
     the rest carry extra ammo for wall/door/cage features). So a shooter chips
     a hard pixel over several passes, one point per shot (damagePerShot 1). */
  const healths = new Map();
  for (const e of (pid.pixelHealths || []))
    healths.set(e.x + ',' + e.y, e.health || 1);

  for (const p of pid.pixels){
    const cells = [];
    for (let dx = 0; dx < (p.areaX || 1); dx++)
      for (let dy = 0; dy < (p.areaY || 1); dy++){
        const x = p.x + dx, y = p.y + dy;
        if (x >= 0 && y >= 0 && x < W && y < H) cells.push([x, y]);
      }
    if (!cells.length) continue;
    const idx = pixels.length;
    const hp = healths.get(p.x + ',' + p.y) || 1;
    pixels.push({ mat: p.material, cells: cells, alive: true,
                  hp: hp, hpMax: hp, inflight: 0 });
    for (const c of cells) owner[c[1] * W + c[0]] = idx;
  }

  const st = {
    n: n, raw: raw, W: W, H: H, pixels: pixels, owner: owner,
    // PixelGridController.CalculatePixelSize: the picture has a physical size
    // per level (5.0..7.0), so one cell is this many world units
    cellWorld: (pid.physicalWidth || 6) / Math.max(W, H),
    liveByMat: new Map(),          // material -> Set(pixelIdx) still alive
    alivePerMat: new Map(),
    remaining: 0,
    slotCount: raw.SlotCount == null ? 5 : raw.SlotCount,
    surprise: new Set((raw.SurpriseShooters && raw.SurpriseShooters.Shooters) || []),
    queues: ((raw.QueueGroup && raw.QueueGroup.shooterQueues) || []).map(q =>
      q.shooters.map(s => ({ id: s.id, mat: s.material, ammo: s.ammo }))),
    slots: [],                     // carriages riding the loop
    entrance: [],                  // the slot-entrance queue, dragons jumping in
    shots: [],
    pw: Object.assign({}, META.pw),   // bought in the shop\n    leaving: [],                      // fly-off effect
    autoFin: false, ejectBuf: [], winAt: 0, failAt: 0, failWhy: '',
    armed: null, tray: null, handBypass: null,
    state: 'play', failReason: '', fired: 0, exits: 0, depleted: 0, stallSince: 0,
    exitLog: [],
    t0: performance.now()
  };

  for (let i = 0; i < pixels.length; i++){
    const m = pixels[i].mat;
    st.alivePerMat.set(m, (st.alivePerMat.get(m) || 0) + 1);
    let s = st.liveByMat.get(m); if (!s) st.liveByMat.set(m, s = new Set());
    s.add(i);
    st.remaining++;
  }

  buildFeatures(st, raw);
  return st;
}

/* ======================= level features =============================
   The 2300 shipped levels use exactly twelve feature containers, all of them
   attached to a shooter, a carriage or the belt - never to the picture. Shapes
   below are measured across all 2300 levels; the rules are from the feature
   controllers in reverse/disasm plus the game's own feature blurbs. Anything
   marked INFERRED could not be pinned down from the binary alone.
   ==================================================================== */

function buildFeatures(st, raw){
  const byId = new Map();
  const reg = q => { for (const sh of q) byId.set(sh.id, sh); };
  st.queues.forEach(reg);

  // ShooterPipes {ShooterId, Queue{shooters[]}} - "Rescue all the dragons inside!"
  // The pipe is itself a shooter that carries a nested queue; its contents take
  // its place in the queue when it leaves, so all of them must be played.
  st.pipes = 0;
  for (const p of ((raw.ShooterPipes && raw.ShooterPipes.Pipes) || [])){
    const host = byId.get(p.ShooterId);
    const inner = ((p.Queue && p.Queue.shooters) || []).map(
      s => ({ id: s.id, mat: s.material, ammo: s.ammo }));
    inner.forEach(sh => byId.set(sh.id, sh));
    if (!host) continue;
    host.pipe = inner;
    st.pipes++;
  }

  const flag = (ids, key, val) => {
    for (const id of (ids || [])){
      const sh = byId.get(id);
      if (sh) sh[key] = (val === undefined ? true : val);
    }
  };

  // SurpriseShooters [id] - colour hidden until it reaches the front
  flag((raw.SurpriseShooters && raw.SurpriseShooters.Shooters), 'surprise');
  // Locks [id] - "Release keys to open locks!"  Not tappable while locked.
  flag((raw.Locks && raw.Locks.Shooters), 'locked');
  // Hammers [id] - pairs with wood blocks, which this funnel's levels never
  // contain, so the dragon plays normally and is only marked.
  flag((raw.Hammers && raw.Hammers.Shooters), 'hammer');
  // AstronautShooters [id] - pairs with a spaceship, likewise absent here.
  flag((raw.AstronautShooters && raw.AstronautShooters.Shooters), 'astro');

  // ConnectedShooters {Id, Shooters[]} - "They move together!"
  st.group = new Map();
  for (const c of ((raw.ConnectedShooters && raw.ConnectedShooters.Connections) || [])){
    const ids = c.Shooters || [];
    if (ids.length > 1) for (const id of ids) st.group.set(id, ids);
  }
  // ChainedShooters {Id, Shooters[]} - "Set the dragons free when they reach first
  // in line!"  Shackled: untappable until any member of the chain is at the
  // head of its queue, which frees the whole chain.
  st.chains = [];
  for (const c of ((raw.ChainedShooters && raw.ChainedShooters.Chains) || [])){
    const ids = c.Shooters || [];
    if (ids.length < 2) continue;
    const ch = { ids: ids, broken: false };
    st.chains.push(ch);
    for (const id of ids){ const sh = byId.get(id); if (sh) sh.chain = ch; }
  }
  // ShooterIceBlocks {ShooterId, Health} - "Deplete other dragons to shatter their
  // ice!"  INFERRED: Health counts shots fired by any other shooter.
  for (const b of ((raw.ShooterIceBlocks && raw.ShooterIceBlocks.IceBlocks) || [])){
    const sh = byId.get(b.ShooterId);
    if (sh){ sh.ice = b.Health; sh.ice0 = b.Health; }
  }
  /* BullTotems {ShooterId, Count} - "Move the totem to the front, then send
     piggies to chip away at it until it breaks!"
     BullTotemFeature.OnShootersExitingQueue (0x5026524) -> CheckActivation
     (0x5024ba8) -> PlayActivate / PlayHit (0x5024730): the totem ACTIVATES when
     its shooter reaches the head, and is then a shot target. It is an obstacle,
     which the offense controller handles specially - FilterObstacleTargets
     (0x4ece4dc), IsTargetObstacle (0x4ece1a4), HitTarget.MatchAllTargets - so
     any colour can hit it and it takes priority over pixels.
     Here it is chipped one per shot fired by any other shooter [?]. A faithful
     Round-3 audit: the decrement really is keyed to queue exits, but with a
     3-condition population filter and an activation latch (see tickFeatures).
     A faithful port must ALSO put the totem in the target list as an obstacle with
     priority; keying it to queue exits (an earlier guess here) deadlocks any
     level whose every queue head is a totem, e.g. level 1574. */
  for (const t of ((raw.BullTotems && raw.BullTotems.Totems) || [])){
    const sh = byId.get(t.ShooterId);
    if (sh){ sh.totem = t.Count; sh.totem0 = t.Count; }
  }
  // MusicToyMallets {ShooterId, Material} - the notes it should strike are not
  // in this funnel's data, so the mallet is marked and plays normally.
  for (const m of ((raw.MusicToyMallets && raw.MusicToyMallets.Mallets) || [])){
    const sh = byId.get(m.ShooterId);
    if (sh) sh.mallet = m.Material;
  }
  // SlotCages {SlotIndex, Material, Health} - "Collect pixels to blast the door
  // open and unlock the blocked slot!"  Health pixels of Material must die.
  st.cages = ((raw.SlotCages && raw.SlotCages.Cages) || []).map(c => ({
    slot: c.SlotIndex, mat: c.Material, need: c.Health, got: 0, open: false }));
  // ConveyorDoors {Percent, Material, Health} - "Pass walls with same color
  // dragons to destroy the walls!"  A gate at Percent of the loop; only matching
  // dragons may cross, and each crossing costs the door one health.
  st.doors = ((raw.ConveyorDoors && raw.ConveyorDoors.Doors) || []).map(d => ({
    pct: d.Percent, mat: d.Material, health: d.Health, health0: d.Health }));

  st.byId = byId;
}

/* CheckShooterTargetIsReserved (0x4ed4e6c) stops two shooters wasting ammo on
   the same target. With health it has to count the shots in flight against the
   health still standing, or a 6-health pixel would only ever be shot once. */
const isReserved = p => p.inflight >= p.hp;

/* One shot, one point of damage, one cell (damagePerShot 1 [A]). A pixel with
   health left stays solid and keeps blocking the line behind it. */
function killPixel(st, idx){
  const p = st.pixels[idx];
  if (!p.alive) return;
  if (p.inflight > 0) p.inflight--;
  if (--p.hp > 0) return;                 // chipped, not dead
  p.alive = false;
  st.remaining--;
  st.alivePerMat.set(p.mat, (st.alivePerMat.get(p.mat) || 1) - 1);
  const live = st.liveByMat.get(p.mat); if (live) live.delete(idx);
  /* SlotCageFeature.OnTargetDeath (0x5193940) checks Pixel.get_IsBigPixel
     (0x4f342e0) and bails before incrementing, so a multi-cell pixel does NOT
     count toward the cage. */
  if (p.cells.length === 1)
    for (const c of st.cages)
      if (!c.open && c.mat === p.mat && ++c.got >= c.need) c.open = true;
}

const slotBlocked = (st, i) => st.cages.some(c => c.slot === i && !c.open);

// ConveyorController.get_EmptySlotCount / CanReceiveItemCount (0x52718b0)
/* ConveyorItemSlot.Return (0x4fc68a4) is an animation: the carriage jumps back
   to slotReturnPoint over `returnMoveDuration` (+0x78) with `returnJumpHeight`
   (+0x68), so for that moment it exists but cannot take a shooter. That is why
   a shooter which survives a lap goes to the ENTRANCE QUEUE instead of straight
   back onto the belt: TryPlaceShooterToEmptySlot's TryGetFree branch finds
   nothing, and SlotEntranceQueueController.TryEnqueue (0x52bd740) accepts it -
   with the queue non-empty it accepts unconditionally (`cbnz w8` at 0x52bd788),
   and with the queue empty it only asks the conveyor whether it has room, which
   a carriage on its way back still counts toward. So:
     - CanReceiveItemCount / emptySlotCount: a carriage with no shooter counts,
       returning or not (it is about to be available).
     - "board it now" (the entrance drain, and the free-slot branch below): a
       returning carriage is skipped.
   `returnMoveDuration` is a measured serialized value: 0.25 s (9.1). Setting it
   to 0 is what made the first build re-board instantly and never use the queue. */
const RETURN_MS = 250;                  // [A] ConveyorItemSlot.returnMoveDuration
const returning = s => (s.returnUntil || 0) > nowMs();
const emptySlotCount = st =>
  st.slots.reduce((a, s, i) => a + (!s.dragon && !slotBlocked(st, i) ? 1 : 0), 0);
const canReceiveItemCount = st => emptySlotCount(st);

/* Why a shooter cannot be tapped right now, or null if it can. */
function tapBlock(st, sh){
  if (sh.locked) return '자물쇠 — 잠긴 드래곤';
  if (sh.ice > 0) return '얼음 ' + sh.ice + ' — 다른 드래곤이 큐를 떠날 때마다 1씩 깨짐';
  if (sh.totem > 0) return '토템 ' + sh.totem + ' — 맨 앞에 온 뒤 다른 드래곤을 더 보내야 함';
  if (sh.chain && !sh.chain.broken) return '족쇄 — 체인이 맨 앞에 와야 풀림';
  return null;
}

/* =========================== directional scan =======================
   PixelGridController.ScanDirectionalPixels: walk a column from the shooter's
   side of the picture and return the first pixel found. Data y grows upward,
   so an Up-facing shooter (riding the bottom stretch) starts at y = 0 and a
   Down-facing one (top stretch) starts at y = H - 1.
   ================================================================== */

/* FirstSolidsFromSideAxis (0x4ecfb08) -> TryToFillSolidTargetDataListOnPoint
   (0x4ecff98): walk one line of the grid inward from the edge the shooter rides
   and return the FIRST SOLID pixel, whatever its colour. The colour test is a
   separate step - IsValidTarget (0x4ed3514) calls Shooter::get_Material - so a
   pixel of another colour sitting in front of yours BLOCKS it. That is the
   whole puzzle: the picture has to be peeled in the order its colours allow. */
function scanLine(st, side){
  if (!side) return -1;
  let x = side.x, y = side.y;
  const n = side.dx ? st.W : st.H;
  for (let k = 0; k < n; k++, x += side.dx, y += side.dy){
    if (x < 0 || y < 0 || x >= st.W || y >= st.H) break;
    const o = st.owner[y * st.W + x];
    if (o >= 0 && st.pixels[o].alive) return o;   // first solid, colour ignored
  }
  return -1;
}

// IsValidTarget: the front pixel is only a target if it is this shooter's colour
const validTarget = (st, idx, mat) =>
  idx >= 0 && !isReserved(st.pixels[idx]) && (mat < 0 || st.pixels[idx].mat === mat);

/* SurpriseShooters carry a placeholder material that owns no pixel in the level
   (material 1, 77330 rounds of ammo against 68322 pixels of that id, and most
   of those pixels are in other funnels) - the real colour is decided at reveal
   time by SurpriseShooterFeatureController (HandleFirstShooterReveal). That
   feature's choice is not in the APK, so this picks the live colour that is
   most useful right now. INVENTED, but it keeps the dragon a real colour carrier,
   which is what the original does - there is no "shoots anything" wildcard in
   IsValidTarget (0x4ed3514); its only early-out is Shooter.IsDeactivated

/* Revealing a surprise shooter is PURELY VISUAL.
   SurpriseShooterFeature.Reveal (0x5209e10) is
   ShooterAnimationController.JumpStationary (0x4eed1d4) + PlayRevealVfx
   (0x5209cdc) + a virtual tail-call - it never touches the material. The colour
   in the level data is the real one all along; the feature only hides it until
   the shooter reaches the head of its queue (HandleFirstShooterReveal
   0x520a764, driven by OnMapQueueShooterChangedCallback 0x520a718).
   Proof from the data: with the stored colours, per-material ammo equals the
   sum of pixel health EXACTLY on levels 9 (13 surprise shooters), 11 (10), 5,
   20, 24 - so re-picking a colour at reveal time, as an earlier version of this
   file did, broke the ammo invariant (11.1). */
function revealShooter(st, sh){
  if (sh.revealed) return;
  sh.revealed = true;
}

/* ShootersOffenseController.GetShooterSide (libil2cpp.so 0x4ecaab8):

     side = (abs(dx) < abs(dz)) ? (dz < 0 ? 2 : 3) : (dx >= 0 ? 1 : 0)
     // 0 = -X left, 1 = +X right, 2 = -Z bottom, 3 = +Z top

   dx/dz are the shooter's offset from the grid centre, compared as RAW absolute
   values - the split between the left/right and bottom/top faces is a 45 degree
   diagonal no matter how oblong the picture is. FindFrontTargetBest then scans
   rows for sides 0/1 and columns for sides 2/3. */
function slotScan(slot){
  const p = pathPoint(L.path, slot.s);
  const dx = p[0] - (L.gx + L.gw / 2);
  const dy = p[1] - (L.gy + L.gh / 2);

  if (Math.abs(dx) >= Math.abs(dy)){
    // side 0 / 1: scan a row inward from the left or right edge
    const inward = dx < 0;
    return {
      axis: 'row', n: G.H,
      at: (p[1] - L.gy) / L.cell,                  // screen row, fractional
      line: row => (row < 0 || row >= G.H) ? null : (inward
        ? { x: 0,       y: G.H - 1 - row, dx: 1,  dy: 0 }
        : { x: G.W - 1, y: G.H - 1 - row, dx: -1, dy: 0 })
    };
  }
  // side 2 / 3: scan a column inward from the bottom or top edge
  const up = dy > 0;
  return {
    axis: 'col', n: G.W,
    at: (p[0] - L.gx) / L.cell,                    // column, fractional
    line: col => (col < 0 || col >= G.W) ? null : (up
      ? { x: col, y: 0,       dx: 0, dy: 1 }
      : { x: col, y: G.H - 1, dx: 0, dy: -1 })
  };
}

// What this carriage can shoot from where it is right now.
function pickTarget(st, slot){
  if (COLUMN_SCAN){
    // FindFrontTargetBest (0x4ed3b00) + GatherAlignedRows/Cols (0x4ecdc14 /
    // 0x4ed0204): every line within an alignment tolerance is a candidate,
    // walked nearest-aligned first, and the first valid unreserved front pixel
    // wins. The real tolerance is a serialized field we cannot read, so
    // ALIGN_TOL stands in for it.
    const mat = slot.dragon.mat;
    const g = slotScan(slot);
    const home = Math.floor(g.at);
    // world tolerance -> cells: cellWorld = physicalWidth / width
    const tol = Math.max(1, Math.round(ALIGN_TOLERANCE_WORLD / st.cellWorld));
    for (let d = 0; d <= tol; d++){
      for (const s of (d ? [-d, d] : [0])){
        const side = g.line(home + s);
        if (!side) continue;
        const idx = scanLine(st, side);
        if (validTarget(st, idx, mat)){ slot.aim = home + s; return idx; }
      }
    }
    return -1;
  }

  const set = st.liveByMat.get(slot.dragon.mat);
  if (!set || !set.size) return -1;
  const p0 = pathPoint(L.path, slot.s);
  const cx = (p0[0] - L.gx) / L.cell, cy = G.H - 1 - (p0[1] - L.gy) / L.cell;
  let best = -1, bestD = Infinity;
  for (const idx of set){
    const p = st.pixels[idx];
    if (!p.alive || isReserved(p)) continue;
    for (const c of p.cells){
      const dx = c[0] - cx, dy = c[1] - cy;
      const d = dx * dx + dy * dy;
      if (d < bestD){ bestD = d; best = idx; }
    }
  }
  return best;
}

// Is there any column at all whose surface pixel this material could hit?
function matHasFront(st, mat){
  const f = mat;
  const ok = side => { const i = scanLine(st, side); return validTarget(st, i, f); };
  for (let col = 0; col < st.W; col++){
    if (ok({ x: col, y: 0, dx: 0, dy: 1 })) return true;
    if (ok({ x: col, y: st.H - 1, dx: 0, dy: -1 })) return true;
  }
  for (let y = 0; y < st.H; y++){
    if (ok({ x: 0, y: y, dx: 1, dy: 0 })) return true;
    if (ok({ x: st.W - 1, y: y, dx: -1, dy: 0 })) return true;
  }
  return false;
}

const canEverShoot = (st, mat) => COLUMN_SCAN
  ? matHasFront(st, mat)
  : st.alivePerMat.get(mat) > 0;

/* ====================== conveyor path (spline loop) ================== */

function buildPath(x0, y0, x1, y1, r){
  const pts = [];
  const arc = (cx, cy, a0, a1) => {
    for (let i = 0; i <= 8; i++){
      const a = a0 + (a1 - a0) * i / 8;
      pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
    }
  };
  // clockwise on screen, starting at the top-left corner heading right
  pts.push([x0 + r, y0]);
  pts.push([x1 - r, y0]);
  arc(x1 - r, y0 + r, -Math.PI / 2, 0);
  pts.push([x1, y1 - r]);
  arc(x1 - r, y1 - r, 0, Math.PI / 2);
  pts.push([x0 + r, y1]);
  arc(x0 + r, y1 - r, Math.PI / 2, Math.PI);
  pts.push([x0, y0 + r]);
  arc(x0 + r, y0 + r, Math.PI, Math.PI * 1.5);

  const cum = [0];
  for (let i = 1; i < pts.length; i++)
    cum.push(cum[i-1] + Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]));
  const total = cum[cum.length-1]
    + Math.hypot(pts[0][0] - pts[pts.length-1][0], pts[0][1] - pts[pts.length-1][1]);
  return { pts: pts, cum: cum, total: total };
}

// Arc length of the loop's bottom-right extreme: the seam where carriages
// board (slotStartPoint) and, when finished, leave (slotReturnPoint).
function pathSeam(path){
  let best = 0, bestV = -Infinity;
  for (let i = 0; i < path.pts.length; i++){
    const v = path.pts[i][0] + path.pts[i][1];
    if (v > bestV){ bestV = v; best = i; }
  }
  return path.cum[best] || 0;
}

function pathPoint(path, s){
  const pts = path.pts, cum = path.cum, total = path.total;
  s = ((s % total) + total) % total;
  let i = 1;
  while (i < cum.length && cum[i] < s) i++;
  const a = pts[(i - 1) % pts.length], b = pts[i % pts.length];
  const s0 = cum[i - 1], s1 = (i < cum.length ? cum[i] : total);
  const k = s1 > s0 ? (s - s0) / (s1 - s0) : 0;
  return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
}

/* ============================ player input ============================ */

let bumpMsg = '', bumpAt = 0;
const bump = m => { bumpMsg = m; bumpAt = nowMs(); };

/* MapLogic.ExecuteTap -> SlotEntranceQueueController.TryEnqueue. The tap does
   not put the dragon on the belt: it acquires an entrance slot (AcquireQueueSlot),
   animates a jump to it (StartJump / JumpToQueueSlot), and only once
   HasShooterArrived does TryDrainToSlots hand it to a free carriage. A roped
   group enqueues together, one entrance slot each. */
function tapQueue(qi){
  if (!G || G.state !== 'play' || !L) return;
  const q = G.queues[qi];
  if (!q || !q.length) return;

  const front = q[0];
  const bypass = G.handBypass === front;      // Hand powerup, one tap only

  /* MapController.ExecuteTap (0x52936f4): a shooter that carries a tap-logic
     feature does NOT board - the tap raises TriggerTapShooterWithLogic
     (0x527c984) and that feature acts instead. The branch is just
     "feature != null" (0x5541028 = !isNull). The only thing that refuses the
     tap outright is MapTapBlocker (0x52b6e5c), which is a tutorial whitelist
     and knows nothing about features. So an iced dragon IS tappable: its
     ShooterIceBlockFeatureController.OnTapShooterWithLogic (0x518ab64) takes
     1 off its own ice. That is the second ice damage source, alongside the
     per-queue-exit chipping in tickFeatures. */
  if (!bypass && front.ice > 0){
    front.ice = Math.max(0, front.ice - 1);
    bump(front.ice > 0 ? '얼음 ' + front.ice + ' — 탭으로 1 깨짐' : '얼음 깨짐!');
    return;
  }

  const why = bypass ? null : tapBlock(G, front);
  if (why){ bump(why); return; }

  const ids = G.group.get(front.id);
  const picks = [];
  if (ids){
    /* ConnectedShooterCanTapCondition.IsAllTappableAndInQueue (0x5043d38) is
         if (!allTappable(member)) return false;      // this+0x28 delegate
         return MapProvider.IsShooterInMapQueue(member);   // 0x52b7988
       and the sibling test is IsShooterBlockedInFront (0x5043e34), with
       ShooterQueueController.GetInFrontShooters (0x4ee4c18) supplying "who is
       ahead of me". So a roped group is only tappable when NO member has
       anything in front of it - every one of them has to be at the head of its
       own queue. A member already aboard (or on a pad) is exempt: IsInConveyor
       (0x5044010) takes it out of the check.
       The `allTappable` delegate itself is serialized and unreadable [X]; the
       "all members at the front" reading is the game's own behaviour. */
    let notAtFront = 0;
    for (const id of ids){
      let placed = null;
      for (const qq of G.queues){
        const at = qq.findIndex(s => s.id === id);
        if (at >= 0){ placed = { sh: qq[at], at: at }; break; }
      }
      if (!placed) continue;                 // already aboard: exempt
      if (placed.at !== 0){ notAtFront++; continue; }
      picks.push(placed.sh);
    }
    if (!bypass && notAtFront){
      bump('연결된 대포 ' + notAtFront + '기가 아직 맨 앞이 아니다');
      return;
    }
    if (!picks.length) return;
    // a roped partner that is itself still shackled or frozen holds them all
    if (!bypass) for (const sh of picks){
      const w = tapBlock(G, sh);
      if (w){ bump('연결된 드래곤: ' + w); return; }
    }
  } else picks.push(front);

  /* The whole admission rule for a tap is CanReceiveItemCount(n). A roped group
     boards together, so it needs that many carriages at once. The waiting queue
     does not enter into it - a tapped shooter goes on the belt or not at all. */
  if (freeCarriages() < picks.length){
    bump(picks.length > 1 ? '연결된 드래곤용 캐리지 부족' : '빈 캐리지 없음');
    return;
  }
  const now = nowMs();
  for (const sh of picks){
    let from = null;
    for (let k = 0; k < G.queues.length; k++){
      const at = G.queues[k].indexOf(sh);
      if (at < 0) continue;
      const r = queueRect(k, Math.min(at, L.qRows - 1));
      from = [r[0] + r[2] / 2, r[1] + r[3] / 2];
      // ShooterPipeFeature: the pipe's contents take its place in the queue
      const inner = sh.pipe && sh.pipe.length ? sh.pipe : null;
      G.queues[k].splice(at, 1, ...(inner || []));
      if (inner) sh.pipe = null;
      break;
    }
    revealShooter(G, sh);
    // TryPlaceShootersToConveyor -> TryActivateSlot: straight onto a carriage,
    // with the hop drawn from where it stood in the queue
    const fi = freeCarriage();
    if (fi < 0) break;               // gated above; cannot normally happen
    boardSlot(G.slots[fi], sh, from);
    G.exits++;                       // OnShootersExitingQueue
    G.exitLog.push(sh);              // who left, for the ice/totem population
  }
}

/* Feature bookkeeping that runs once per simulation step. */
function tickFeatures(st, shotsThisStep, exitsThisStep, depletions){   // shots unused since round 3
  // SurpriseShooterFeatureController.HandleFirstShooterReveal: the colour shows
  // once the dragon is at the head of its queue
  for (const q of st.queues) if (q.length) revealShooter(st, q[0]);

  // ChainedShooterFeature: any member reaching the head of its queue frees all
  for (const ch of st.chains){
    if (ch.broken) continue;
    for (const q of st.queues)
      if (q.length && ch.ids.indexOf(q[0].id) >= 0){ ch.broken = true; break; }
  }
  /* Everything below keys off WHO left a queue this step, not off shots fired.
     ShooterIceBlockFeatureController.OnShooterWillDisappear (0x518ae4c):
       if (!hasIceInLevel) return;                     // cdq +0x48, set in
                                                       // OnLevelCreated 0x518b054
       if (isShooterDisabledCondition(shooter)) return; // vtable +0x188
       counter++; ExecuteIceDamage();                   // 0x518ac48
     ExecuteIceDamage builds DamageInfo(amount = counter), calls DamageIceBlocks
     (0x518a8a0) which walks EVERY ShooterIceBlockFeature attached to the level,
     then resets the counter (str wzr,[x19,#0x4c]).  Since that is its only
     caller the effective damage is 1 per event - and it lands on every ice
     block at once.  That is what makes Health up to 116 reachable: a level has
     dozens to a hundred-odd shooters, not 116 shots.  (The earlier guess here -
     "one per shot fired" - was wrong.) */
  const exited = st.exitLog;
  st.exitLog = [];
  if (exited.length) for (const sh of st.byId.values())
    if (sh.ice > 0) sh.ice = Math.max(0, sh.ice - exited.length);

  /* BullTotemFeature.  Two verified pieces:
     CheckActivation (0x5024ba8) is a one-shot latch that only fires once the
     totem's own shooter reaches the HEAD of its queue
     (isShooterFirstInQueueCondition +0x70), and on firing it snapshots a global
     counter (0xaae6178) into +0xa8 - which is how the activation frame itself
     is skipped by the decrement path (0x50266bc compares it back).
     OnShootersExitingQueue (0x5026524) then counts, out of a global list, only
     the entries that are (1) not this totem's own paired shooter, (2) still
     valid, and (3) not claimed by another totem - and does
     Count = max(Count - n, 0).  countSyncPowerupChannels (+0x68) is itself an
     enumerable, not the counter.
     At Count <= 0 DestroySelf (0x50244d0) fires TriggerMakeShooterDisappear on
     the paired shooter.  This port only clears the gate instead: removing the
     shooter would delete its 10-50 ammo and leave its colour's pixels
     unshootable, which the ammo invariant (11.1) forbids.  Flagged in
     UNITY_SPEC.md 7.7. */
  for (const sh of st.byId.values()){
    if (!(sh.totem > 0)) continue;
    if (!sh.totemActive){
      for (const q of st.queues) if (q.length && q[0] === sh){ sh.totemActive = true; break; }
      continue;                        // the activation step never decrements
    }
    const n = exited.reduce((a, e) => a + (e !== sh && !(e.totem > 0) ? 1 : 0), 0);
    if (n) sh.totem = Math.max(0, sh.totem - n);
  }
  // LockKeyFeatureController: each depleted shooter releases one key, and
  // SortLocksFromLeftToRight opens the leftmost lock first. INFERRED - the key
  // objects themselves are not in this funnel's level data.
  /* LockFeature.IsAvailableToUnlock (0x50ea05c) is
       isShooterFirstInQueueCondition.Call(owner) && !IsUnlocked
     so only a lock whose own shooter is at the head of its queue is a
     candidate; SortLocksFromLeftToRight (0x50eb240) then picks the leftmost.
     What actually releases a key is a picture-attached KeyFeature (Unlock
     0x50e7fec) driven by OnReleasablesUnblocked (0x50ea2ec) - and this funnel's
     level JSON carries no key objects at all, so the trigger below (one key per
     depleted shooter) is INVENTED. */
  for (let d = 0; d < depletions; d++){
    let best = null;
    for (let qi = 0; qi < st.queues.length; qi++){
      const head = st.queues[qi][0];
      if (head && head.locked){ best = head; break; }   // leftmost queue first
    }
    if (!best) break;
    best.locked = false;
  }
}

/* MapController.HandleConveyorExit (0x529a214): the shooter that just came off
   the belt is cast to Shooter, and if it is not already flagged gone
   ([+0x74] / [+0x76]) it goes to TryPlaceShooterToEmptySlot (0x528d668):

       if (entranceQueue.HasPending && entranceQueue.TryEnqueue(sh)) return;
       if (slotGroup.TryGetFree(out slot)) { PlaceShooterToSlot(sh, slot); return; }
       if (entranceQueue.TryEnqueue(sh)) return;
       MapEvents.TriggerSlotsFullAtConveyorExit(sh);   // 0x52856f0

   so it is NEVER thrown away - it goes back to the waiting area with its
   remaining ammo, which is what keeps the per-material ammo == pixel count
   invariant true. Only when both the entrance queue and the slot group refuse
   it does the last line fire, and MapFailController.OnSlotsFullAtConveyorExit
   (0x52a3b18) turns that into a fail. */
/* TryActivateSlot is what actually puts a shooter on the belt, so the carriage
   is taken the moment a placement is accepted - the hop is only the model
   catching up (ConveyorItemSlot.Prepare, 6.3). `boardFrom`/`boardT0` drive that
   hop, and the shooter holds its fire until it lands. */
function boardSlot(slot, dragon, from){
  slot.dragon = dragon;
  slot.nextFire = nowMs();
  slot.idle = true;
  slot.s = L.entryS;                  // slotStartPoint
  slot.travel = 0;
  slot.boardFrom = from || null;
  slot.boardT0 = nowMs();
}
const boarding = slot => slot.boardT0 && nowMs() - slot.boardT0 < JUMP_MS;

/* SlotEntranceQueueController.TryEnqueue (0x52bd740), all 39 instructions:

       var pending = this[+0x60];
       if (pending.Count != 0) goto accept;                  // cbnz w8 @0x52bd788
       if (!ConveyorHasRoom(get_Conveyor())) return false;    // 0x5cfb568
     accept:
       StartJump(CreateEntry(sh));                            // 0x52bd384 -> 0x52bcf30
       return true;

   So the belt is consulted ONLY when the waiting queue is empty; once anyone is
   waiting, every further shooter is accepted no matter how full the belt is.
   That is what lets the waiting area fill up. Gating every enqueue on free
   carriages (the first version here) meant it could never hold more than the
   belt had room for, so a shooter coming off the belt flashed through it in one
   jump - which is exactly what it looked like. */
function freeCarriage(){
  return G.slots.findIndex((s, k) => !s.dragon && !returning(s) && !slotBlocked(G, k));
}
/* ConveyorController.CanReceiveItemCount(n) (0x52718b0) is literally
   `get_EmptySlotCount() >= n` - no reservation ledger, no entrance pads. It is
   the ONLY gate on a tap (ExecuteTap -> GetShootersToPlaceToConveyor ->
   TryPlaceShootersToConveyor), so with every carriage busy a tap does nothing:
   a tapped shooter can never park in the waiting queue. */
const freeCarriages = () =>
  G.slots.reduce((a, s, k) => a + (!s.dragon && !returning(s) && !slotBlocked(G, k) ? 1 : 0), 0);

/* TryEnqueue (0x52bd740). Its only callers are TryPlaceShooterToEmptySlot (the
   conveyor exit) and the pipe insert - never a tap. A free pad accepts
   unconditionally; with none free it only accepts if the conveyor can take the
   shooter right now, which means going straight back onto a carriage. */
function tryEnqueueEntrance(dragon, from){
  if (G.entrance.length < ENTRANCE_CAP){          // a pad is free: accept
    G.entrance.push({ dragon: dragon, from: from, t0: nowMs() });
    return true;
  }
  const i = freeCarriage();
  if (i >= 0){ boardSlot(G.slots[i], dragon, from); return true; }
  return false;
}

function exitToWaiting(dragon, from){
  if (G.entrance.length < ENTRANCE_CAP){                 // a pad is free
    tryEnqueueEntrance(dragon, from);
    return;
  }
  /* The waiting area is full, so the shooter that just finished its lap has
     nowhere to stand: MapEvents.TriggerSlotsFullAtConveyorExit (0x52856f0) ->
     MapFailController (0x52a3b18) -> FailGame. Game over.

     TryPlaceShooterToEmptySlot does carry a middle branch that would drop it
     straight onto a free carriage instead, but nothing boards without a tap in
     this build (see the entrance-drain note), so that branch is deliberately
     not taken - a full waiting area is a loss. */
  G.lostAtExit = (G.lostAtExit || 0) + 1;
  pendFail(slotsFullReason(true));
}

/* MapFailController.OnSlotsFullAtConveyorExit (0x52a3b18):
     if (CanShootAnyTargetNew()) TriggerOutOfSpaceFail();
     else                        TryCheckForCannotShootFail();
   and that coroutine runs the 6.7 discriminator - queue heads first
   (Locked > Frozen > BullTotem, largest group wins, ties in that order), then
   the grid group (Spaceship > Curtain > Ufo, none of which exist in this
   funnel's 2300 levels, 7.13), falling back to Obstacle. */
function slotsFullReason(fromExit){
  // OutOfSpace belongs to the exit event only; the stall path is
  // CheckForCannotShootFail, which has no such reason (6.7).
  if (fromExit && canShootAnyTarget()) return '출구 만석 — Out of Space';
  // NormallyTappableFirstShooterExists (0x52a2930): a clean head skips step 3
  const heads = G.queues.map(q => q[0]).filter(Boolean);
  const tappable = heads.some(sh => !tapBlock(G, sh));
  if (!tappable){
    const groups = [
      ['자물쇠로 막힘 — LockedOut', heads.filter(sh => sh.locked).length],
      ['얼음으로 막힘 — Frozen',    heads.filter(sh => sh.ice > 0).length],
      ['토템으로 막힘 — BullTotem', heads.filter(sh => sh.totem > 0).length]
    ];
    let best = groups[0];
    for (const g of groups) if (g[1] > best[1]) best = g;   // ties keep the order
    if (best[1] > 0) return best[0];
  }
  return '장애물로 막힘 — Obstacle';
}

/* ============================== simulation ============================== */

/* ===================== AutoFinisher (6.8) =====================
   MapController.TryActivateAutoFinisher (0x528d43c) latches ONCE when the
   remaining shooter count is <= the belt's slot count, and is rechecked
   whenever a shooter disappears (MakeShooterDisappear is one of its three call
   sites). Its two subscribers set the conveyor's `cks` - which stops items
   being removed at the path end - and DetachAllWalls. The level flag
   `triggerAutoFinisher` is not in this funnel's level JSON, so it is treated as
   set [?]. */
function remainingShooters(){
  let n = 0;
  for (const q of G.queues) for (const sh of q){
    n++;
    if (sh.pipe) n += sh.pipe.length;
  }
  n += G.entrance.length;
  for (const sl of G.slots) if (sl.dragon) n++;
  if (G.tray) n++;
  return n;
}
function tryActivateAutoFinisher(){
  if (!G || G.autoFin) return;
  if (remainingShooters() > G.slots.length) return;
  G.autoFin = true;
  for (const d of G.doors) d.health = 0;      // WallFeatureController.DetachAllWalls
  bump('오토피니셔 — 벨트 2배, 벽 해제');
}

// GameFinishController: a fail is announced after instantFailDelay and a win
// after checkCompleteDelay (9.1). Both latch so the reason cannot flip.
function pendFail(reason){
  if (G.failAt) return;
  G.failAt = nowMs() + FAIL_DELAY_MS;
  G.failWhy = reason;
}

/* ===================== the frame, in 6.6 order =====================
   ConveyorController.Update runs its item list in three passes with named steps
   between them; they are split out here so the order is explicit. */
function cleanupSlots(){
  // CleanupSlots 0x5267448: drop dead entries. Here, a carriage whose return
  // trip is over becomes available again.
  for (const sl of G.slots) if (sl.returnUntil && sl.returnUntil <= nowMs()) sl.returnUntil = 0;
}

function refreshGateBuffer(){
  // RefreshGateBuffer 0x5267668: the live gates, ordered along the path.
  G.gateBuf = G.doors.filter(d => d.health > 0).sort((a, b) => a.pct - b.pct);
}

function checkCheckpoints(from, to, total){
  /* CheckCheckpoints 0x52679c4. The serialized list is one entry,
     { id: "fail_warning", percent: 0.5 } (9.1), and the level JSON carries no
     checkpoint data - so this only records crossings. */
  for (const c of (G.checkpoints || [{ id: 'fail_warning', percent: 0.5 }])){
    const at = c.percent * total;
    if (from <= at && to >= at) G.checkpointHits = (G.checkpointHits || 0) + 1;
  }
}

function processEjects(){
  // ProcessEjects 0x5267da0: everything the gate pass marked leaves the belt.
  if (!G.ejectBuf || !G.ejectBuf.length) return;
  for (const sl of G.ejectBuf){
    if (!sl.dragon) continue;
    sl.dragon = null; sl.travel = 0;
    sl.returnUntil = nowMs() + RETURN_MS;
    G.depleted++; G.ejected = (G.ejected || 0) + 1;
  }
  G.ejectBuf.length = 0;
  tryActivateAutoFinisher();
}

function step(now, dt){
  clock = now;
  if (G.state !== 'play' || !L) return;

  const shots0 = G.fired, exits0 = G.exits, dep0 = G.depleted;
  const pxPerWorld = L.gw / (G.raw.PixelImageData.physicalWidth || 6);
  const total = L.path.total;
  /* clipStart / clipEnd (9.1): the usable stretch of the spline is
     [clipStart, clipEnd] = [0, 0.995], so a lap is 0.995 of the path and the
     seam sits at clipEnd, not at 1.0. */
  const lapLen = (CLIP_END - CLIP_START) * total;
  const move = BELT_SPEED_WORLD * beltMult() * pxPerWorld * dt;

  // ---- pass 0: CleanupSlots ----
  cleanupSlots();

  // ---- pass 1: advance every item's percent ----
  for (const sl of G.slots){
    if (!sl.dragon) continue;
    sl.prevS = sl.s;
    sl.prevTravel = sl.travel || 0;
    sl.travel = sl.prevTravel + move;
    sl.s = (sl.s + move) % total;
  }

  /* ---- pass 1b: EnforceSpacing 0x526696c, exactly 6.6.5 ----
     `cko[0]` is the item that boarded last (TryActivateSlot prepends at index
     0), `cko[Count-1]` is the one nearest the exit, and the loop walks from the
     back forward: each item pushes the one AHEAD of it forward until the
     required gap is met, clamped at 1.0.
         requiredGap = minSpacing + (A.Length + B.Length) * 0.5   [A] = 1.0
         B.enforced  = min(max(limit, B.raw), 1.0)
     Boarding order is recoverable from `travel`: more travel means it boarded
     earlier, so ascending travel is cko order. */
  const gapWorld = MIN_SPACING + (BASE_ITEM_LENGTH + BASE_ITEM_LENGTH) * 0.5;
  const gapPx = gapWorld * pxPerWorld;
  const items = G.slots.filter(sl => sl.dragon).sort((a, b) => (a.travel || 0) - (b.travel || 0));
  for (let k = 0; k < items.length - 1; k++){
    const A = items[k], B = items[k + 1];          // B rides ahead of A
    const limit = A.travel + gapPx;
    if (B.travel < limit){
      const d = Math.min(limit, lapLen) - B.travel;
      if (d > 0){ B.travel += d; B.s = (B.s + d) % total; }
    }
  }

  // ---- pass 2: RefreshGateBuffer, then checkpoints and gates per item ----
  refreshGateBuffer();
  G.ejectBuf = G.ejectBuf || [];
  for (const sl of G.slots){
    if (!sl.dragon) continue;
    const from = sl.prevS, to = sl.prevS + (sl.travel - sl.prevTravel);
    checkCheckpoints(from, to, total);
    for (const d of G.gateBuf){
      const gate = d.pct * total;
      if (!(from <= gate && to >= gate) && !(to >= total && gate <= to - total)) continue;
      if (sl.dragon.mat === d.mat){
        d.health--;                    // NotifyItemPassed: the wall takes a hit
      } else {
        /* ConveyorDoorFeature.EvaluateEject / ShouldEject (0x506bb14 /
           0x5070a08): a carriage whose shooter does not match the door's
           material goes into the conveyor's eject buffer, and ProcessEjects
           throws it off the belt - its remaining ammo is lost. */
        if (G.ejectBuf.indexOf(sl) < 0) G.ejectBuf.push(sl);
        break;
      }
    }
  }
  processEjects();

  // ---- pass 3: the path end ----
  for (const sl of G.slots){
    if (!sl.dragon) continue;
    if (sl.travel < lapLen) continue;
    sl.travel = 0;
    if (G.autoFin) continue;           // cks == true: the item keeps riding
    const dragon = sl.dragon;
    sl.dragon = null;                     // Remove + ConveyorItemSlot.Return
    sl.returnUntil = now + RETURN_MS;
    G.conveyorExits = (G.conveyorExits || 0) + 1;
    exitToWaiting(dragon, pathPoint(L.path, sl.s));      // HandleConveyorExit
    tryActivateAutoFinisher();
  }

  /* ---- SlotEntranceQueueController.Update: the pads just wait ----
     TryDrainToSlots (0x52bc8a0) is NOT driven from Update - its only callers are
     OnSlotBlockerRemoved and OnSlotReleasedAfterFull, and it early-returns while
     the timed-out flags (+0x78 / +0x79) are set. Update itself only starts the
     hop for a new entry and, for one already landed, counts dt into +0x24 until
     gracePeriod (0.15 s) elapses and OnShooterEntranceTimedOut fires.
     So a shooter that came off the belt SITS on its pad; sending it out again is
     a tap like any other placement. Polling this every frame is what made it
     re-board the instant its own carriage came back - it looked like it never
     left the belt. */
  for (const e of G.entrance){
    if (now - e.t0 >= JUMP_MS) e.waited = (e.waited || 0) + dt;   // +0x24
  }

  // ---- TickShooter: rate driven, up to MAX_SHOTS_PER_TICK caught up ----
  const superMul = 1;
  const period = 1000 / SHOTS_PER_SEC;
  for (const slot of G.slots){
    const dragon = slot.dragon;
    if (!dragon) continue;
    if (dragon.ammo <= 0){ dragon.done = true; continue; }
    if (boarding(slot)){ slot.idle = true; continue; }   // still hopping aboard
    // its colour is gone: the ~8% ammo surplus the real levels reserve for
    // obstacle features has nothing to hit here, so it is finished too
    if (!(G.alivePerMat.get(dragon.mat) > 0)){ dragon.done = true; continue; }

    /* TickShooter's own budget (0x4ecd1ec..0x4ecd23c):
         sps    = max(FinalShotsPerSecond, 0.001)      // .rodata 0x1d60b94
         n      = ceil((dt + 1e-4) * sps)              // fcvtps, .rodata 0x1d5fd04
         budget = clamp(n + 1, 1, 16)                  // add/cmp #0x10/csinc x2
       so a frame gets a whole number of shots up front, capped at 16. */
    const budget = Math.max(1, Math.min(MAX_SHOTS_PER_TICK,
      Math.ceil((dt + 1e-4) * Math.max(0.001, SHOTS_PER_SEC * superMul)) + 1));
    if (slot.nextFire < now - period * budget) slot.nextFire = now - period * budget;

    let fired = 0;
    while (fired < budget && slot.nextFire <= now && dragon.ammo > 0){
      const t = pickTarget(G, slot);
      if (t < 0) break;
      G.pixels[t].inflight++;         // CheckShooterTargetIsReserved
      dragon.ammo--; G.fired++;
      G.shots.push({ mat: dragon.mat, slot: slot, target: t, t: now + fired * 22 });
      slot.nextFire += period;        // SetNextFire
      fired++;
    }
    slot.idle = fired === 0;
    if (slot.idle && slot.nextFire < now) slot.nextFire = now;

    /* ShootersOffenseController.ProcessDepletions (0x4ecd4d4) runs every frame:
       for each shooter it collected as depleted it raises OnShooterAmmoDepleted
       (+0x100), and MapController.HandleShooterAmmoDepleted (0x5294d38) is two
       instructions - `mov w2, wzr; b MakeShooterDisappear` (0x528dfdc) ->
       MapLogic.RemoveShooter (0x528b594). An empty shooter leaves the belt AT
       ONCE, wherever it is. */
    if (dragon.ammo <= 0){
      const at = pathPoint(L.path, slot.s);
      slot.dragon = null; slot.travel = 0; G.depleted++;
      slot.returnUntil = now + RETURN_MS;
      leaveOutward(dragon, at[0], at[1]);    // mine: fly out, not in
      tryActivateAutoFinisher();          // rechecked on every disappearance
    }
  }

  for (let k = G.shots.length - 1; k >= 0; k--){
    if (now - G.shots[k].t >= FLIGHT_MS){
      killPixel(G, G.shots[k].target);
      G.shots.splice(k, 1);
    }
  }

  /* ConveyorDoorFeatureController.Evaluate (0x507432c) + HasAmmoSupply
     (0x5074260): if no shooter anywhere still carries that door's material with
     ammo left, the door ForceOpens (0x506e9b0) whatever its health. */
  for (const d of G.doors){
    if (d.health <= 0) continue;
    let supply = false;
    for (const q of G.queues) for (const sh of q){
      if (sh.mat === d.mat && sh.ammo > 0){ supply = true; break; }
      if (sh.pipe) for (const in2 of sh.pipe)
        if (in2.mat === d.mat && in2.ammo > 0){ supply = true; break; }
    }
    if (!supply) for (const e of G.entrance) if (e.dragon.mat === d.mat && e.dragon.ammo > 0) supply = true;
    if (!supply) for (const sl of G.slots) if (sl.dragon && sl.dragon.mat === d.mat && sl.dragon.ammo > 0) supply = true;
    if (!supply) d.health = 0;           // ForceOpen
  }

  tickFeatures(G, G.fired - shots0, G.exits - exits0, G.depleted - dep0);

  // ---- win / fail, both on their measured delays ----
  if (G.remaining === 0){
    if (!G.winAt) G.winAt = now + WIN_DELAY_MS;      // checkCompleteDelay
    else if (now >= G.winAt) finish('win');
    return;
  }
  G.winAt = 0;

  if (G.failAt){                                     // instantFailDelay
    if (now >= G.failAt) finish('fail', G.failWhy);
    return;
  }

  const inQueues = G.queues.reduce((a, q) => a + q.length, 0);
  const onBelt = G.slots.filter(s => s.dragon).length;
  if (!inQueues && !onBelt && !G.entrance.length && !G.shots.length){
    pendFail('슈터 소진 — Out of Shoots'); return;
  }

  // nothing on the board can ever hit anything again and nothing new can board
  if (!G.shots.length && !anyoneUseful()){
    if (!G.stallSince) G.stallSince = now;
    else if (now - G.stallSince > 900){
      const freed = RELIEF ? relieveGate() : null;
      if (freed){ bump('게이트 해제: ' + freed); G.stallSince = 0; }
      else pendFail(slotsFullReason());
    }
  } else G.stallSince = 0;
}

/* Open one shut gate, cheapest first. Returns what was opened, or null. */
function relieveGate(){
  // Only worth opening a gate if the shooter behind it could actually shoot;
  // a board that is dead from colour occlusion is a genuine Out of Space and
  // must not burn the level's gates on the way to reporting it.
  const helps = sh => canEverShoot(G, sh.mat);

  // same eligibility as IsAvailableToUnlock: head of its queue only
  let pick = null;
  for (let qi = 0; qi < G.queues.length && !pick; qi++){
    const head = G.queues[qi][0];
    if (head && head.locked && helps(head)) pick = head;
  }
  if (pick){ pick.locked = false; return '자물쇠'; }

  let best = null;
  for (const sh of G.byId.values())
    if (sh.ice > 0 && helps(sh) && (!best || sh.ice < best.ice)) best = sh;
  if (best){ best.ice = 0; return '얼음'; }

  best = null;
  for (const sh of G.byId.values())
    if (sh.totem > 0 && helps(sh) && (!best || sh.totem < best.totem)) best = sh;
  if (best){ best.totem = 0; return '토템'; }

  for (const ch of G.chains){
    if (ch.broken) continue;
    for (const id of ch.ids){
      const sh = G.byId.get(id);
      if (sh && helps(sh)){ ch.broken = true; return '족쇄'; }
    }
  }

  best = null;
  for (const d of G.doors)
    if (d.health > 0 && (!best || d.health < best.health)) best = d;
  if (best){ best.health = 0; return '컨베이어 문'; }

  for (const c of G.cages) if (!c.open){ c.open = true; return '슬롯 케이지'; }
  return null;
}

/* Can the board still change?

   A carriage only frees when its shooter empties, so a shooter waiting in a
   queue or on an entrance pad is worthless unless some carriage can still
   shoot, or a carriage is free right now. With occlusion on, a shooter whose
   colour is buried is idle but not dead - another carriage peeling the blocker
   in front of it revives it. Nothing shooting and nothing able to board is the
   real dead end, and it is exactly TriggerOutOfSpaceFail. */
/* CanShootAnyTargetNew (0x52a2604): a whole-board query. It takes
   GetNotDisabledShooters when NormallyTappableFirstShooterExists (0x52a2930),
   else the narrower GetShootersOutsideOfQueue, then returns true on the first
   shooter whose CanShoot succeeds. */
function canShootAnyTarget(){
  const tappableHead = G.queues.some(q => q.length && !tapBlock(G, q[0]));
  for (const s of G.slots) if (s.dragon && canEverShoot(G, s.dragon.mat)) return true;
  for (const e of G.entrance) if (canEverShoot(G, e.dragon.mat)) return true;
  if (!tappableHead) return false;               // queue-only population
  for (const q of G.queues)
    if (q.length && !tapBlock(G, q[0]) && canEverShoot(G, q[0].mat)) return true;
  return false;
}

function anyoneUseful(){
  /* "Can anything still happen, ever?" - the stall detector, so it must not
     confuse "not right now" with "never". Carriage capacity is deliberately
     NOT part of it: carriages recycle at the path end, so a momentary shortage
     is not a dead board. Weighing capacity here killed level 2300 while four
     unblocked queue heads still had reachable targets (audit F7). Capacity
     belongs to the tap gate (CanReceiveItemCount) and nowhere else. */
  for (const s of G.slots) if (s.dragon && canEverShoot(G, s.dragon.mat)) return true;
  for (const e of G.entrance) if (canEverShoot(G, e.dragon.mat)) return true;

  // every queue head gated by a feature with no release path: that IS dead, and
  // 6.7 will name it (LockedOut / Frozen / BullTotem)
  if (!G.queues.some(q => q.length && !tapBlock(G, q[0]))) return false;

  for (const q of G.queues) for (const sh of q){
    if (canEverShoot(G, sh.mat)) return true;          // it will reach the head
    if (sh.pipe) for (const i2 of sh.pipe) if (canEverShoot(G, i2.mat)) return true;
  }
  return false;
}

function finish(kind, reason){
  G.state = kind; G.failReason = reason || '';
  /* Meta bookkeeping. A fail costing one heart is how the genre works, but the
     original's heart cost, refill timer and gold reward are server side and
     absent from the APK [X] - these numbers are placeholders. */
  if (kind === 'win'){
    cleared.add(G.n);
    META.current = Math.max(META.current, Math.min(LV_MAX, G.n + 1));
    META.gold += 40 + 10 * dif(G.raw.Difficulty).pips;   // harder pays more
  } else {
    spendHeart();
  }
  saveMeta();
  $('title').textContent = kind === 'win' ? '클리어!' : '실패!';
  $('sub').textContent = kind === 'win'
    ? '레벨 ' + G.n + ' · ' + G.fired + '발 · ' + ((performance.now() - G.t0) / 1000).toFixed(1) + '초'
    : reason;
  $('act').textContent = kind === 'win' ? '다음 레벨' : '다시 시도';
  const target = kind === 'win' ? G.n + 1 : G.n;
  $('act').onclick = () => load(target);
  $('overlay').classList.add('on');
}

/* ================================ layout ================================ */

function layout(){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = cv.clientWidth, h = cv.clientHeight;
  cv.width = Math.max(1, Math.round(w * dpr));
  cv.height = Math.max(1, Math.round(h * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!G){ L = null; return; }

  const pigH = 24, gapH = 4, pad = 8, belt = 32;
  const qRows  = Math.min(QUEUE_ROWS, Math.max.apply(null, G.queues.map(q => q.length).concat([1])));
  const queueH = qRows * (pigH + gapH) + 16;

  const entH = 30, puH = 30;
  const boardH = Math.max(120, h - queueH - entH - puH - pad * 2 - 12);
  const innerW = w - pad * 2 - belt * 2 - 10, innerH = boardH - belt * 2 - 10;
  const cell = Math.max(2, Math.min(innerW / G.W, innerH / G.H));
  const gw = cell * G.W, gh = cell * G.H;
  const gx = w / 2 - gw / 2, gy = pad + boardH / 2 - gh / 2;

  const m = Math.max(belt * 0.85, 22);
  const path = buildPath(gx - m, gy - m, gx + gw + m, gy + gh + m, Math.min(28, m));
  const prevTotal = L && L.path ? L.path.total : 0;

  L = {
    w: w, h: h, cell: cell, gx: gx, gy: gy, gw: gw, gh: gh,
    path: path, belt: belt,
    entryS: pathSeam(path),
    entY: pad + boardH + 4, entH: entH,
    puY: pad + boardH + 4 + entH + 4, puH: puH,
    queueY: pad + boardH + 4 + entH + 4 + puH + 4,
    queueH: queueH, pigH: pigH, gapH: gapH, qRows: qRows
  };

  // carriages sit evenly around the loop; keep relative spacing across resizes
  if (!G.slots.length){
    for (let i = 0; i < G.slotCount; i++)
      G.slots.push({ s: path.total * i / G.slotCount, dragon: null, nextFire: 0,
                     idle: true, lap: 0 });
  } else if (prevTotal && prevTotal !== path.total){
    const k = path.total / prevTotal;
    for (const s of G.slots) s.s = (s.s * k) % path.total;
  }
}

function puRect(i){
  const n = POWERUPS.length;
  const totalW = Math.min(L.w - 16, n * 52);
  const cw = totalW / n;
  return [(L.w - totalW) / 2 + i * cw + 2, L.puY + 2, cw - 4, L.puH - 4];
}

// the slot-entrance queue: ENTRANCE_CAP pads between the belt and the queues
function entRect(i){
  const n = Math.max(5, G.entrance.length);
  const totalW = Math.min(L.w - 20, n * 40);
  const cw = totalW / n;
  return [(L.w - totalW) / 2 + i * cw + 3, L.entY + 2, cw - 6, L.entH - 4];
}

function queueRect(qi, row){
  const n = G.queues.length, pad = 10;
  const cw = (L.w - pad * 2) / n, x = pad + qi * cw;
  const bw = Math.min(cw - 8, 44);
  return [x + (cw - bw) / 2, L.queueY + row * (L.pigH + L.gapH), bw, L.pigH];
}

/* ================================ render ================================ */

function rr(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function badge(img, x, y, size){
  if (!ready(img)) return false;
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  const k = size / Math.max(iw, ih);
  ctx.drawImage(img, x, y, iw * k, ih * k);
  return true;
}

/* Idle blink. The original has a blink pose (pig_blink) but the schedule is in
   an AnimatorController we do not read, so the 3.4 s cycle is ours [?]. */
function blinking(sh){
  if (sh._ph == null){
    let hv = 0, t = String(sh.id);
    for (let i = 0; i < t.length; i++) hv = (hv * 131 + t.charCodeAt(i) * 617) % 3400;
    sh._ph = hv;
  }
  return ((nowMs() + sh._ph) % 3400) < 140;
}

function drawDragon(x, y, w, h, sh, opts){
  opts = opts || {};
  const known = !sh.surprise || sh.revealed;
  const gated = G && tapBlock(G, sh);
  const spr = known ? tintedDragon(sh.mat, blinking(sh)) : null;

  if (spr){
    rr(x, y, w, h, 6);
    ctx.fillStyle = colorOf(sh.mat); ctx.globalAlpha = 0.34;
    ctx.fill(); ctx.globalAlpha = 1;
    const k = Math.min(w / spr.width, h / spr.height) * 1.18;
    const dw = spr.width * k, dh = spr.height * k;
    ctx.save();
    if (gated) ctx.globalAlpha = 0.45;
    ctx.drawImage(spr, x + (w - dw) / 2, y + (h - dh) / 2 - 1, dw, dh);
    ctx.restore();
  } else {
    rr(x, y, w, h, 6);
    ctx.fillStyle = known ? colorOf(sh.mat) : '#5b4c70';
    ctx.fill();
  }
  ctx.lineWidth = opts.hi ? 2 : 1;
  ctx.strokeStyle = opts.hi ? '#ffffff' : 'rgba(0,0,0,.35)';
  rr(x, y, w, h, 6); ctx.stroke();

  // ammo, on a dark plate so it reads over the sprite
  const label = known ? String(sh.ammo) : '?';
  ctx.font = '700 ' + Math.min(12, Math.round(h * 0.46)) + 'px Segoe UI,system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const tw = ctx.measureText(label).width + 8;
  rr(x + w / 2 - tw / 2, y + h - 11, tw, 11, 5);
  ctx.fillStyle = 'rgba(12,8,16,.72)'; ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillText(label, x + w / 2, y + h - 5.5);

  // feature badges
  const bs = Math.max(9, h * 0.42);
  if (sh.locked) badge(ART.lock, x - 1, y - 2, bs);
  else if (sh.ice > 0) badge(sh.ice > 1 ? ART.iceClock : ART.ice, x - 1, y - 2, bs);
  else if (sh.chain && !sh.chain.broken) badge(ART.fChain, x - 2, y - 1, bs);
  else if (sh.totem > 0) badge(ART.fTotem, x - 1, y - 2, bs);
  else if (sh.pipe && sh.pipe.length) badge(ART.fPipe, x - 2, y - 1, bs);
  else if (sh.mallet != null) badge(ART.music, x - 1, y - 2, bs * 0.8);
  else if (sh.hammer) badge(ART.hammer, x - 1, y - 2, bs * 0.8);
  else if (sh.astro) badge(ART.fAstro, x - 1, y - 2, bs * 0.8);
  else if (!known) badge(ART.question, x - 1, y - 2, bs * 0.8);

  // counters that matter
  ctx.font = '700 9px Segoe UI';
  ctx.fillStyle = '#ffd9e2';
  if (sh.ice > 0) ctx.fillText(String(sh.ice), x + w - 7, y + 6);
  else if (sh.totem > 0) ctx.fillText(String(sh.totem), x + w - 7, y + 6);
  else if (sh.pipe && sh.pipe.length) ctx.fillText(String(sh.pipe.length), x + w - 7, y + 6);

  if (opts.roped){
    ctx.beginPath(); ctx.arc(x + w - 5, y + h - 14, 2.4, 0, 6.2832);
    ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fill();
  }
}

function render(now){
  ctx.clearRect(0, 0, L.w, L.h);
  const P = L.path, gx = L.gx, gy = L.gy, cell = L.cell;

  // ---- conveyor lane ----
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(P.pts[0][0], P.pts[0][1]);
  for (let i = 1; i < P.pts.length; i++) ctx.lineTo(P.pts[i][0], P.pts[i][1]);
  ctx.closePath();
  ctx.lineWidth = L.belt; ctx.strokeStyle = '#221b2d'; ctx.stroke();
  ctx.lineWidth = L.belt - 6; ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.stroke();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.13)';
  const phase = (now / 1000 * BELT_SPEED_WORLD * 60) % 18;
  for (let s = phase; s < P.total; s += 18){
    const a = pathPoint(P, s), b = pathPoint(P, s + 6);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  }

  // ---- picture ----
  ctx.fillStyle = 'rgba(255,255,255,.03)';
  ctx.fillRect(gx - 2, gy - 2, L.gw + 4, L.gh + 4);
  for (const p of G.pixels){
    if (!p.alive) continue;
    ctx.fillStyle = colorOf(p.mat);
    for (const c of p.cells)
      ctx.fillRect(gx + c[0] * cell, gy + (G.H - 1 - c[1]) * cell, cell + 0.6, cell + 0.6);
  }

  // ---- conveyor doors (ConveyorDoorFeature) ----
  for (const d of G.doors){
    if (d.health <= 0) continue;
    const a = pathPoint(P, d.pct * P.total);
    const b = pathPoint(P, d.pct * P.total + 6);
    const ang = Math.atan2(b[1] - a[1], b[0] - a[0]) + Math.PI / 2;
    ctx.save();
    ctx.translate(a[0], a[1]); ctx.rotate(ang);
    rr(-L.belt / 2, -5, L.belt, 10, 3);
    ctx.fillStyle = colorOf(d.mat); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = 'rgba(12,8,16,.8)';
    ctx.font = '700 9px Segoe UI'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(d.health), 0, 0.5);
    ctx.restore();
  }

  // ---- carriages ----
  for (let si = 0; si < G.slots.length; si++){
    const slot = G.slots[si];
    const p = pathPoint(P, slot.s);
    const caged = slotBlocked(G, si);
    if (!slot.dragon && !caged) continue;   // off the belt
    rr(p[0] - 15, p[1] - 12, 30, 24, 7);
    ctx.fillStyle = caged ? '#3a2430' : '#2c2338'; ctx.fill();
    ctx.strokeStyle = caged ? 'rgba(239,90,111,.7)'
      : slot.dragon ? 'rgba(255,255,255,.18)' : 'rgba(255,255,255,.40)';
    ctx.lineWidth = 1; ctx.stroke();
    if (caged){
      const c = G.cages.find(c => c.slot === si && !c.open);
      badge(ART.fSlotCage, p[0] - 11, p[1] - 10, 20);
      ctx.fillStyle = colorOf(c.mat);
      ctx.font = '700 9px Segoe UI'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText((c.need - c.got) + '', p[0] + 9, p[1] + 8);
    }
    if (!slot.dragon) continue;
    // the line it is aiming down (the aligned one it actually picked, if any)
    if (COLUMN_SCAN){
      const g = slotScan(slot);
      const at = (!slot.idle && slot.aim != null) ? slot.aim + 0.5 : g.at;
      const side = g.line(Math.floor(at));
      if (side){
        ctx.strokeStyle = slot.idle ? 'rgba(255,255,255,.07)' : 'rgba(255,255,255,.30)';
        ctx.lineWidth = Math.max(1, cell * 0.7);
        ctx.beginPath();
        if (g.axis === 'col'){
          const x = gx + at * cell;
          ctx.moveTo(x, p[1]);
          ctx.lineTo(x, side.dy > 0 ? gy : gy + L.gh);
        } else {
          const y = gy + at * cell;
          ctx.moveTo(p[0], y);
          ctx.lineTo(side.dx > 0 ? gx + L.gw : gx, y);
        }
        ctx.stroke();
        ctx.lineWidth = 1;
      }
    }
    /* Prepare / PrepareImmediate (6.3): the shooter is already ON the carriage
       as far as the rules go, the sprite just has not caught up yet. */
    if (boarding(slot) && slot.boardFrom){
      const k = (now - slot.boardT0) / JUMP_MS;
      const x = slot.boardFrom[0] + (p[0] - slot.boardFrom[0]) * k;
      const y = slot.boardFrom[1] + (p[1] - slot.boardFrom[1]) * k - Math.sin(k * Math.PI) * 22;
      ctx.globalAlpha = 0.92;
      drawDragon(x - 13, y - 10, 26, 20, slot.dragon, { roped: G.group.has(slot.dragon.id) });
      ctx.globalAlpha = 1;
      continue;
    }
    drawDragon(p[0] - 13, p[1] - 10, 26, 20, slot.dragon, { roped: G.group.has(slot.dragon.id) });
  }

  // ---- projectiles ----
  for (const sh of G.shots){
    const k = Math.max(0, Math.min(1, (now - sh.t) / FLIGHT_MS));
    const from = pathPoint(P, sh.slot.s);
    const c0 = G.pixels[sh.target].cells[0];
    const tx = gx + (c0[0] + .5) * cell, ty = gy + (G.H - 1 - c0[1] + .5) * cell;
    const x = from[0] + (tx - from[0]) * k, y = from[1] + (ty - from[1]) * k;
    ctx.beginPath(); ctx.arc(x, y, Math.max(2.5, cell * .34), 0, 6.2832);
    ctx.fillStyle = colorOf(sh.mat); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1; ctx.stroke();
  }

  // ---- spent shooters flying off the belt ----
  if (G.leaving) for (let i = G.leaving.length - 1; i >= 0; i--){
    const e = G.leaving[i], k = (now - e.t0) / LEAVE_MS;
    if (k >= 1 || k < 0){ G.leaving.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = 1 - k * k;
    ctx.translate(e.x + e.vx * k, e.y + e.vy * k);
    ctx.rotate(e.spin * k * 1.1);
    const sc = 1 - k * 0.3;
    ctx.scale(sc, sc);
    drawDragon(-13, -10, 26, 20, e.dragon, {});
    ctx.restore();
  }

  // ---- slot-entrance queue ----
  for (let i = 0; i < Math.max(5, G.entrance.length); i++){
    const r = entRect(i);
    rr(r[0], r[1], r[2], r[3], 6);
    ctx.fillStyle = 'rgba(255,255,255,.04)'; ctx.fill();
    ctx.strokeStyle = canReceiveItemCount(G) === 0
      ? 'rgba(239,90,111,.55)' : 'rgba(255,255,255,.14)';
    ctx.lineWidth = 1; ctx.stroke();
  }
  for (let i = 0; i < G.entrance.length; i++){
    const e = G.entrance[i], r = entRect(i);
    const to = [r[0] + r[2] / 2, r[1] + r[3] / 2];
    const k = Math.max(0, Math.min(1, (now - e.t0) / JUMP_MS));
    const from = e.from || to;
    const x = from[0] + (to[0] - from[0]) * k;
    const y = from[1] + (to[1] - from[1]) * k - Math.sin(k * Math.PI) * 22;
    if (k < 1){
      ctx.globalAlpha = 0.9;
      drawDragon(x - 12, y - 9, 24, 18, e.dragon, { roped: G.group.has(e.dragon.id) });
      ctx.globalAlpha = 1;
    } else {
      drawDragon(to[0] - 13, to[1] - 9, 26, 18, e.dragon, { roped: G.group.has(e.dragon.id) });
    }
  }

  // ---- queues, with ropes between connected shooters ----
  const seen = new Map();
  for (let qi = 0; qi < G.queues.length; qi++)
    for (let row = 0; row < Math.min(L.qRows, G.queues[qi].length); row++){
      const r = queueRect(qi, row);
      seen.set(G.queues[qi][row].id, [r[0] + r[2] / 2, r[1] + r[3] / 2]);
    }
  ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 1.5;
  const drawn = new Set();
  for (const ids of G.group.values()){
    if (drawn.has(ids)) continue; drawn.add(ids);
    const pts = ids.map(i => seen.get(i)).filter(Boolean);
    if (pts.length < 2) continue;
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
  }
  for (let qi = 0; qi < G.queues.length; qi++){
    const q = G.queues[qi];
    for (let row = 0; row < Math.min(L.qRows, q.length); row++){
      const r = queueRect(qi, row), sh = q[row];
      sh.surprise = G.surprise.has(sh.id);
      drawDragon(r[0], r[1], r[2], r[3], sh, {
        hi: row === 0 && G.state === 'play', roped: G.group.has(sh.id)
      });
    }
    if (q.length > L.qRows){
      const r = queueRect(qi, L.qRows - 1);
      ctx.fillStyle = '#a495b8'; ctx.font = '600 10px Segoe UI'; ctx.textAlign = 'center';
      ctx.fillText('+' + (q.length - L.qRows), r[0] + r[2] / 2, r[1] + L.pigH + 11);
    }
  }

  // ---- powerups ----
  for (let i = 0; i < POWERUPS.length; i++){
    const pu = POWERUPS[i], r = puRect(i);
    rr(r[0], r[1], r[2], r[3], 8);
    ctx.fillStyle = G.pw[pu.key] > 0 ? '#332843' : '#231d2e'; ctx.fill();
    ctx.strokeStyle = G.armed === pu.key ? '#ffd23f' : 'rgba(255,255,255,.14)';
    ctx.lineWidth = G.armed === pu.key ? 2 : 1; ctx.stroke();
    ctx.save();
    if (!G.pw[pu.key]) ctx.globalAlpha = 0.35;
    const artKey = pu.key !== 'tray' ? pu.art
      : G.tray ? 'trayFull' : G.armed === 'tray' ? 'trayHalf' : 'tray';
    if (!badge(ART[artKey], r[0] + 4, r[1] + 3, r[3] - 6)){
      ctx.fillStyle = '#a495b8'; ctx.font = '700 9px Segoe UI';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(pu.label, r[0] + 5, r[1] + r[3] / 2);
    }
    ctx.restore();
    ctx.fillStyle = '#efe9f5'; ctx.font = '700 10px Segoe UI';
    ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('x' + G.pw[pu.key], r[0] + r[2] - 4, r[1] + r[3] - 4);
  }

  if (bumpMsg && now - bumpAt < 1000){
    ctx.globalAlpha = 1 - (now - bumpAt) / 1000;
    ctx.fillStyle = '#ef5a6f'; ctx.font = '700 13px Segoe UI'; ctx.textAlign = 'center';
    ctx.fillText(bumpMsg, L.w / 2, L.entY - 3);
    ctx.globalAlpha = 1;
  }
}

function frame(now){
  requestAnimationFrame(frame);
  if (!G || inHome) return;
  if (!L) layout();
  const dt = Math.min(0.05, lastNow ? (now - lastNow) / 1000 : 0.016);
  lastNow = now;
  step(now, dt);
  render(now);
  const tot = G.pixels.length;
  $('meta').textContent = G.raw.Difficulty + ' · ' + G.W + '×' + G.H
    + ' · 픽셀 ' + (tot - G.remaining) + '/' + tot
    + ' · 큐 ' + G.queues.reduce((a, q) => a + q.length, 0)
    + ' · 진입 ' + G.entrance.length
    + (G.tray ? ' · 트레이 1' : '')

    + ' · 슬롯 ' + G.slots.filter(s => s.dragon).length + '/' + G.slotCount;
}

/* ================================ input ================================ */

cv.addEventListener('pointerdown', e => {
  if (!G || !L || G.state !== 'play') return;
  const r = cv.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;

  // powerup bar
  if (my >= L.puY && my <= L.puY + L.puH){
    for (let i = 0; i < POWERUPS.length; i++){
      const q = puRect(i);
      if (mx >= q[0] && mx <= q[0] + q[2]){ usePowerup(POWERUPS[i].key); return; }
    }
    return;
  }

  /* SuperShooterPowerupController: SetupSuperShooter / superShooterAppearPoint
     / superShooterShootPoint / OnSelectionFinished(1) / IsPixelViableToShoot -
     one special shooter appears and the player aims it at a pixel. It is not a
     timed buff on the belt. Shape [V], extent of the shot [?]: here it takes
     the tapped pixel's connected same-colour cluster. */
  if (G.armed === 'super' && mx >= L.gx && mx <= L.gx + L.gw
      && my >= L.gy && my <= L.gy + L.gh){
    const cx = Math.floor((mx - L.gx) / L.cell);
    const cy = G.H - 1 - Math.floor((my - L.gy) / L.cell);
    const o0 = (cx >= 0 && cy >= 0 && cx < G.W && cy < G.H) ? G.owner[cy * G.W + cx] : -1;
    if (o0 < 0 || !G.pixels[o0].alive){ bump('픽셀을 탭해라'); return; }
    const mat = G.pixels[o0].mat, seen = new Set([o0]), stack = [o0];
    let hit = 0;
    while (stack.length){
      const idx = stack.pop();
      const px = G.pixels[idx];
      if (!px.alive) continue;
      killPixel(G, idx); hit++;
      for (const c of px.cells)
        for (const d of [[1,0],[-1,0],[0,1],[0,-1]]){
          const nx = c[0] + d[0], ny = c[1] + d[1];
          if (nx < 0 || ny < 0 || nx >= G.W || ny >= G.H) continue;
          const o = G.owner[ny * G.W + nx];
          if (o >= 0 && !seen.has(o) && G.pixels[o].alive && G.pixels[o].mat === mat){
            seen.add(o); stack.push(o);
          }
        }
    }
    G.armed = null; G.pw.super--;
    bump('슈퍼 슈터 ' + hit + '칸 관통');
    return;
  }

  // DemolishPowerupController: armed, the next tap on the picture blasts an area
  if (G.armed === 'demolish' && mx >= L.gx && mx <= L.gx + L.gw
      && my >= L.gy && my <= L.gy + L.gh){
    const cx = Math.floor((mx - L.gx) / L.cell);
    const cy = G.H - 1 - Math.floor((my - L.gy) / L.cell);
    let hit = 0;
    for (let x = cx - 2; x <= cx + 2; x++)
      for (let y = cy - 2; y <= cy + 2; y++){
        if (x < 0 || y < 0 || x >= G.W || y >= G.H) continue;
        const o = G.owner[y * G.W + x];
        if (o >= 0 && G.pixels[o].alive){ killPixel(G, o); hit++; }
      }
    G.armed = null; G.pw.demolish--;
    bump('철거 ' + hit + '칸');
    return;
  }

  /* A pad is a tap target too: the shooter parked there is sent out under the
     same admission rule as any other placement (CanReceiveItemCount). */
  if (my >= L.entY - 8 && my <= L.entY + L.entH + 8){
    for (let i = 0; i < G.entrance.length; i++){
      const r = entRect(i);
      if (mx < r[0] - 6 || mx > r[0] + r[2] + 6) continue;
      const fi = freeCarriage();
      if (fi < 0){ bump('빈 캐리지 없음'); return; }
      const e = G.entrance.splice(i, 1)[0];
      boardSlot(G.slots[fi], e.dragon, [r[0] + r[2] / 2, r[1] + r[3] / 2]);
      return;
    }
    bump('대기 줄이 비어 있다');
    return;
  }

  if (my < L.queueY - 6) return;

  // HandPowerupController: "Pick any dragon or item in the queue."
  if (G.armed === 'hand'){
    for (let qi = 0; qi < G.queues.length; qi++)
      for (let row = 0; row < Math.min(L.qRows, G.queues[qi].length); row++){
        const q = queueRect(qi, row);
        if (mx >= q[0] - 8 && mx <= q[0] + q[2] + 8
            && my >= q[1] - 2 && my <= q[1] + q[3] + 2){
          /* CanTapShooterCondition.CheckWithReason (0x5275558) runs
             CheckPriorityConditions (0x527420c) first, and Hand's
             PowerupPriorityCanTapShooterCondition.IsPriorityActive (0x5275ff4)
             returns tappable immediately, skipping CheckMainConditions
             (0x52742f8) entirely. It is a one-tap bypass of the whole gate
             chain, NOT a state change - the dragon's lock/ice/totem/chain counters
             are left alone. */
          const sh = G.queues[qi][row];
          G.queues[qi].splice(row, 1);
          G.queues[qi].unshift(sh);
          G.handBypass = sh;
          G.armed = null; G.pw.hand--;
          tapQueue(qi);
          G.handBypass = null;
          bump('손: 게이트 무시하고 1회 탑승');
          return;
        }
      }
    bump('큐의 드래곤을 골라라'); return;
  }

  /* IsShooterFirstInQueueCondition (via CanTapShooterCondition, 6.4/6.10):
     only the HEAD of a queue is tappable. The hit box therefore has to be the
     head's own cell - testing the column's x range alone made every visible
     row send the head, which looked like the whole column was selectable. */
  for (let qi = 0; qi < G.queues.length; qi++){
    if (!G.queues[qi].length) continue;
    const r0 = queueRect(qi, 0);
    if (mx < r0[0] - 12 || mx > r0[0] + r0[2] + 12) continue;
    if (my > r0[1] + r0[3] + 4){        // a row behind the head
      bump('맨 앞만 보낼 수 있다');
      return;
    }
    if (G.armed === 'tray'){ useTray(qi); return; }
    tapQueue(qi); return;
  }
});

function usePowerup(key){
  if (!G.pw[key]){ bump('보유 없음'); return; }
  if (G.armed === key){ G.armed = null; return; }
  const pu = POWERUPS.find(p => p.key === key);
  if (key === 'shuffle'){
    // ShufflePowerupController: reorder every queue
    /* MapController.ShuffleQueues (0x528f784) pools every queue but gates each
       shooter through <ShuffleQueues>g__CanMoveShooter|73_0 (0x528d768), so a
       gated dragon stays where it is. */
    const canMove = sh => !tapBlock(G, sh);
    const fixed = G.queues.map(q => q.map(sh => canMove(sh) ? null : sh));
    const all = [];
    for (const q of G.queues) for (const sh of q) if (canMove(sh)) all.push(sh);
    for (let i = all.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      const t = all[i]; all[i] = all[j]; all[j] = t;
    }
    let k = 0;
    for (let qi = 0; qi < G.queues.length; qi++)
      for (let i = 0; i < G.queues[qi].length; i++)
        if (!fixed[qi][i]) G.queues[qi][i] = all[k++];
    G.pw.shuffle--; bump('셔플');
  } else if (key === 'slot'){
    // MapLogic.AddConveyorSlot / RVSlotIncreaser
    const t = L.path.total;
    G.slotCount++;
    G.slots.push({ s: (G.slots.length ? G.slots[G.slots.length - 1].s + t / G.slotCount : 0) % t,
                   dragon: null, nextFire: 0, idle: true });
    G.pw.slot--; bump('슬롯 +1');
  } else {
    G.armed = key; bump(pu.desc);
  }
}

// TrayPowerupController: park the queue head aside, tap again to send it back
function useTray(qi){
  if (G.tray){
    G.queues[qi].unshift(G.tray); G.tray = null; G.armed = null;
    bump('트레이에서 복귀');
    return;
  }
  const q = G.queues[qi];
  if (!q.length) return;
  G.tray = q.shift();
  G.armed = null; G.pw.tray--;
  bump('트레이에 보관');
}

function drawLegend(){
  const el = $('legend'); el.innerHTML = '';
  for (const [label, f] of FEATURE_CHIPS){
    const n = f(G);
    if (!n) continue;
    const d = document.createElement('span'); d.className = 'chip';
    d.style.borderColor = '#7a659b';
    d.textContent = label + ' ' + n;
    el.appendChild(d);
  }
  for (const m of Array.from(G.alivePerMat.keys()).sort((a, b) => a - b)){
    const d = document.createElement('span'); d.className = 'chip';
    d.innerHTML = '<span class="sw" style="background:' + colorOf(m) + '"></span>'
      + (PALETTE[m] ? PALETTE[m][0] : m);
    el.appendChild(d);
  }
}

async function load(n){
  n = Math.max(1, Math.min(PACK.length, n | 0));
  $('lvl').value = n;
  $('overlay').classList.remove('on');
  clock = 0; lastNow = 0;          // the shared sim clock restarts with the level
  bumpMsg = ''; bumpAt = 0;        // a stale toast would stick: clock went backwards
  try { G = buildState(n, await fetchLevel(n)); }
  catch (err){ G = null; L = null; $('meta').textContent = '레벨 로드 실패: ' + err.message; return; }
  drawLegend();
  L = null;
  layout();
}

   mine and deliberately simple: a fail costs a heart, a clear pays gold by

const NODE_H = 112, LV_MAX = PACK_MAN.length;
const DIFFS = {

  slotcage: '슬롯케이지', astro: '우주복', door: '컨베이어 문'
};
const SHOP = [
  { k: 'hearts',   name: '하트 가득',   cost: 150, art: 'heart',     desc: '하트를 5개로 채운다' },
  { k: 'shuffle',  name: '셔플',       cost: 60,  art: 'pwShuffle', desc: '큐 전체를 섞는다' },
  { k: 'tray',     name: '트레이',     cost: 80,  art: 'tray',      desc: '맨 앞 하나를 빼 둔다' },
  { k: 'hand',     name: '집게',       cost: 90,  art: 'pwHand',    desc: '큐 아무 자리나 하나 집는다' },
  { k: 'demolish', name: '해머',       cost: 120, art: 'hammer',    desc: '반경 2칸을 부순다' },
  { k: 'super',    name: '슈퍼 슈터',   cost: 180, art: 'pwSuper',   desc: '그 색 덩어리를 관통 사격' },
  { k: 'slot',     name: '캐리지 +1',  cost: 200, art: 'pwSlot',    desc: '캐리지를 하나 늘린다' },
  { k: 'gold',     name: '골드 +500',  cost: 0,   art: 'coin',      desc: '데모용 무료 지급. 결제 없음' }
];

let MAN = null, inHome = true;
const PW0 = { shuffle: 1, hand: 1, super: 1, slot: 1, demolish: 1, tray: 1 };
/* Heart refill. The APK does not ship this: a full scan of data.unity3d by
   script class finds only `ResourceCaptureSystemEvents` ("Heart Resource
   Capture System Events") and `BonusLevelResourceEarnEvents`, neither of which
   carries a timing value, and `HeartNotificationStateProviderSo`'s
   `heartGeneratorSettings` (+0x28) has no instance in the bundle - the heart
   generator is server/remote config [X]. So these numbers are MINE: one heart
   every 30 minutes up to 5, which is the genre default. */
const HEART_MAX = 5, HEART_REFILL_MS = 30 * 60 * 1000;
const META = Object.assign(
  { cleared: [], hearts: 5, gold: 300, current: 1, heartAt: 0, pw: Object.assign({}, PW0) },
  JSON.parse(localStorage.getItem('bb_meta') || '{}'));
META.pw = Object.assign({}, PW0, META.pw);
let cleared = new Set(META.cleared);
const saveMeta = () => {
  META.cleared = Array.from(cleared);
  localStorage.setItem('bb_meta', JSON.stringify(META));
};
const sheet = (id, on) => $(id).classList[on ? 'add' : 'remove']('on');

/* Roll the refill clock forward. `heartAt` is when the NEXT heart lands; each
   whole interval that has passed since then grants one more. */
function refillHearts(){
  if (META.hearts >= HEART_MAX){ META.heartAt = 0; return; }
  if (!META.heartAt){ META.heartAt = Date.now() + HEART_REFILL_MS; saveMeta(); return; }
  let changed = false;
  while (META.hearts < HEART_MAX && Date.now() >= META.heartAt){
    META.hearts++;
    META.heartAt += HEART_REFILL_MS;
    changed = true;
  }
  if (META.hearts >= HEART_MAX) META.heartAt = 0;
  if (changed) saveMeta();
}
const heartLeftMs = () => (META.hearts >= HEART_MAX || !META.heartAt)
  ? 0 : Math.max(0, META.heartAt - Date.now());
function spendHeart(){
  META.hearts = Math.max(0, META.hearts - 1);
  if (!META.heartAt) META.heartAt = Date.now() + HEART_REFILL_MS;   // clock starts on the first loss
  saveMeta();
}

function syncMeta(){
  refillHearts();
  const left = heartLeftMs();
  $('cHeart').textContent = META.hearts + (left
    ? ' (' + Math.floor(left / 60000) + ':' + String(Math.floor(left / 1000) % 60).padStart(2, '0') + ')'
    : '');
  $('cGold').textContent  = META.gold;
  $('cStar').textContent  = cleared.size;
  $('icHeart').src = url(META.hearts ? 'heart' : 'heartEmpty');
}

const nodeTop = n => (LV_MAX - n) * NODE_H;

function nodeHtml(r){
  const d = dif(r.d), done = cleared.has(r.n), cur = r.n === META.current;
  return '<div class="nd' + (done ? ' cl' : '') + (cur ? ' cur' : '')
    + '" data-n="' + r.n + '" style="top:' + (nodeTop(r.n) + 14)
    + 'px;--c1:' + d.c1 + ';--c2:' + d.c2 + '">'
    + '<div class="hex"></div>'
    + '<div class="hexIn"><span class="num">' + r.n + '</span></div>'
    + '<div class="pips">' + '<i></i>'.repeat(d.pips) + '</div>'
    + '<div class="ndName">' + (r.name || '') + '</div>'
    + (done ? '<img class="done" src="' + url('check') + '">' : '')
    + '</div>';
}

// only the visible slice of the map exists
let win = [0, 0];
function renderTree(force){
  const sc = $('scroll'), tree = $('tree');
  const h = sc.clientHeight || 400, top = sc.scrollTop;
  const from = Math.max(1, LV_MAX - Math.ceil((top + h) / NODE_H) - 1);
  const to   = Math.min(LV_MAX, LV_MAX - Math.floor(top / NODE_H) + 1);
  if (!force && from === win[0] && to === win[1]) return;
  win = [from, to];
  let html = '';
  for (let n = from; n <= to; n++) html += nodeHtml(MAN[n - 1]);
  tree.querySelectorAll('.nd').forEach(e => e.remove());
  tree.insertAdjacentHTML('beforeend', html);
}

function buildTreeChrome(){
  const tree = $('tree');
  tree.style.height = (LV_MAX * NODE_H + 40) + 'px';
  const bands = [['#1b2a4d', '#141d3a'], ['#2a1b3f', '#1d1430'], ['#16302c', '#111f22']];
  let html = '';
  for (let b = 0; b * 100 < LV_MAX; b++){
    const lo = b * 100 + 1, hi = Math.min(LV_MAX, lo + 99), c = bands[b % 3];
    html += '<div class="band" style="top:' + nodeTop(hi) + 'px;height:'
      + ((hi - lo + 1) * NODE_H) + 'px;background:linear-gradient('
      + c[0] + ',' + c[1] + ')"></div>';
  }
  html += '<div class="spine" style="top:20px;height:' + (LV_MAX * NODE_H) + 'px"></div>';
  tree.innerHTML = html;
}

function openCard(n){
